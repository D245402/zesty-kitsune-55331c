<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmaciones - Boda</title>
    <link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
    <div class="container">
        <h1>Confirmaciones de asistencia</h1>
        <div id="loading" class="loading">Cargando confirmaciones...</div>
        <table id="tabla" style="display: none;">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Asistencia</th>
                    <th>Acompañantes</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <a href="/" class="btn">← Volver a la invitación</a>
    </div>

    <script>
        // Función para cargar los datos desde la API
        fetch('/api/confirmaciones')
            .then(response => response.json())
            .then(data => {
                const tbody = document.querySelector('#tabla tbody');
                const loading = document.getElementById('loading');
                const tabla = document.getElementById('tabla');

                if (data.length === 0) {
                    loading.textContent = 'No hay confirmaciones aún.';
                } else {
                    loading.style.display = 'none';
                    tabla.style.display = 'table';

                    data.forEach(conf => {
                        const row = tbody.insertRow();
                        row.innerHTML = `
                            <td>${conf.id}</td>
                            <td>${conf.nombre}</td>
                            <td>${conf.asistencia === 'si' ? '✅ Sí' : '❌ No'}</td>
                            <td>${conf.acompanantes}</td>
                            <td>${new Date(conf.fecha).toLocaleString()}</td>
                        `;
                    });
                }
            })
            .catch(error => {
                document.getElementById('loading').textContent = 'Error al cargar las confirmaciones.';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
