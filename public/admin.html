<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmaciones - Boda</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f8f4f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #b76e79;
            text-align: center;
            margin-top: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th {
            background-color: #b76e79;
            color: white;
            padding: 10px;
            text-align: left;
        }
        td {
            padding: 8px 10px;
            border-bottom: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn {
            display: inline-block;
            background-color: #b76e79;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
        }
        .btn:hover {
            background-color: #a55a65;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirmaciones de asistencia</h1>
        <table>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Asistencia</th>
                <th>Acompañantes</th>
                <th>Fecha</th>
            </tr>
            {% for conf in confirmaciones %}
            <tr>
                <td>{{ conf[0] }}</td>
                <td>{{ conf[1] }}</td>
                <td>
                    {% if conf[2] == 'si' %}
                        ✅ Sí
                    {% else %}
                        ❌ No
                    {% endif %}
                </td>
                <td>{{ conf[3] }}</td>
                <td>{{ conf[4] }}</td>
            </tr>
            {% endfor %}
        </table>
        <a href="/" class="btn">← Volver a la invitación</a>
    </div>
</body>
</html>
