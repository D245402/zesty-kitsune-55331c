<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>¡Gracias por confirmar!</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/estilos.css">
</head>
<body>
  <!-- Decoraciones (mismo estilo que la principal) -->
  <div class="decoracion decoracion1"></div>
  <div class="decoracion decoracion2"></div>
  <div class="decoracion decoracion3"></div>
  <div class="decoracion decoracion4"></div>
  <div class="decoracion decoracion5"></div>
  <div class="linea linea1"></div>
  <div class="linea linea2"></div>
  <div class="linea linea3"></div>
  <div class="linea linea4"></div>

  <div class="tarjeta mensaje-exito">
    <h1 id="mensaje">¡Gracias por confirmar!</h1>
    <p class="info">Te esperamos el 14 de Abril a las 6:00 PM ❤️</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const nombre = urlParams.get('nombre');
    if (nombre) {
      document.getElementById('mensaje').textContent = `¡Gracias por confirmar, ${nombre}!`;
    }
  </script>
</body>
</html>
